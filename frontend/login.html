<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterVapor - Login</title>
    <link rel="stylesheet" href="style.css">
    <style>
        body {
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
        }
        .login-container {
            background: #1b2838;
            padding: 50px;
            border-radius: 8px;
            box-shadow: 0 4px 30px rgba(0,0,0,0.5);
            width: 100%;
            max-width: 450px;
        }
        .login-logo {
            text-align: center;
            font-size: 48px;
            font-weight: bold;
            color: #66c0f4;
            margin-bottom: 40px;
        }
        .login-form {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .form-group {
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        .form-group label {
            color: #c7d5e0;
            font-size: 14px;
            font-weight: 500;
        }
        .form-group input {
            padding: 15px;
            background: #171a21;
            border: 1px solid #66c0f4;
            border-radius: 4px;
            color: #c7d5e0;
            font-size: 16px;
            transition: all 0.3s;
        }
        .form-group input:focus {
            outline: none;
            border-color: #67c1f5;
            box-shadow: 0 0 10px rgba(102, 192, 244, 0.3);
        }
        .login-btn {
            padding: 15px;
            background: #66c0f4;
            border: none;
            border-radius: 4px;
            color: #171a21;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            margin-top: 10px;
        }
        .login-btn:hover {
            background: #67c1f5;
            transform: translateY(-2px);
            box-shadow: 0 4px 15px rgba(102, 192, 244, 0.4);
        }
        .login-btn:disabled {
            background: #4a5f73;
            cursor: not-allowed;
            transform: none;
        }
        .register-link {
            text-align: center;
            margin-top: 20px;
            color: #8f98a0;
            font-size: 14px;
        }
        .register-link a {
            color: #66c0f4;
            text-decoration: none;
            font-weight: 500;
        }
        .register-link a:hover {
            text-decoration: underline;
        }
        .error-message {
            background: #c74646;
            color: white;
            padding: 12px;
            border-radius: 4px;
            text-align: center;
            font-size: 14px;
            display: none;
        }
        .test-users {
            background: #2a475e;
            padding: 15px;
            border-radius: 4px;
            margin-top: 20px;
            font-size: 12px;
            color: #8f98a0;
        }
        .test-users strong {
            color: #66c0f4;
        }
    </style>
</head>
<body>
    <div class="login-container">
        <div class="login-logo">WaterVapor</div>
        
        <div class="error-message" id="errorMessage"></div>
        
        <form class="login-form" id="loginForm">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" required autocomplete="username">
            </div>
            
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" required autocomplete="current-password">
            </div>
            
            <button type="submit" class="login-btn" id="loginBtn">Sign In</button>
        </form>
        
        <div class="register-link">
            Don't have an account? <a href="#" id="registerLink">Create one</a>
        </div>
        
        <div class="test-users">
            <strong>Test Users:</strong><br>
            alice, bob, charlie, diana, eve<br>
            Password: <strong>password123</strong>
        </div>
    </div>

    <script>
        // Check if already logged in
        if (localStorage.getItem('authToken')) {
            window.location.href = 'landingpage.html';
        }

        const loginForm = document.getElementById('loginForm');
        const errorMessage = document.getElementById('errorMessage');
        const loginBtn = document.getElementById('loginBtn');
        const registerLink = document.getElementById('registerLink');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            // Disable button and show loading
            loginBtn.disabled = true;
            loginBtn.textContent = 'Signing in...';
            errorMessage.style.display = 'none';
            
            try {
                const response = await fetch('/api/login', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: username,
                        email: username + '@watervapor.com',
                        password: password
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.token) {
                    // Store credentials
                    localStorage.setItem('authToken', data.token);
                    localStorage.setItem('username', username);
                    
                    // Redirect to landing page
                    window.location.href = 'landingpage.html';
                } else {
                    // Show error
                    errorMessage.textContent = data.error || 'Invalid username or password';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Login failed. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
                loginBtn.textContent = 'Sign In';
            }
        });

        // Handle register link (create new user)
        registerLink.addEventListener('click', async (e) => {
            e.preventDefault();
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            
            if (!username || !password) {
                errorMessage.textContent = 'Please enter a username and password to register';
                errorMessage.style.display = 'block';
                return;
            }
            
            loginBtn.disabled = true;
            errorMessage.style.display = 'none';
            
            try {
                // Register user
                const registerResponse = await fetch('/api/register', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        username: username,
                        email: username + '@watervapor.com',
                        password: password
                    })
                });
                
                if (registerResponse.ok) {
                    // Auto-login after registration
                    const loginResponse = await fetch('/api/login', {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            username: username,
                            email: username + '@watervapor.com',
                            password: password
                        })
                    });
                    
                    const loginData = await loginResponse.json();
                    
                    if (loginResponse.ok && loginData.token) {
                        localStorage.setItem('authToken', loginData.token);
                        localStorage.setItem('username', username);
                        window.location.href = 'landingpage.html';
                    }
                } else {
                    const error = await registerResponse.json();
                    errorMessage.textContent = error.error || 'Registration failed. User may already exist.';
                    errorMessage.style.display = 'block';
                }
            } catch (error) {
                errorMessage.textContent = 'Registration failed. Please try again.';
                errorMessage.style.display = 'block';
            } finally {
                loginBtn.disabled = false;
            }
        });
    </script>
</body>
</html>
