<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WaterVapor - Profile</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <header>
        <nav>
            <a href="landingpage.html" class="logo">WaterVapor</a>
            <ul class="nav-links">
                <li><a href="landingpage.html">Home</a></li>
                <li><a href="store.html">Store</a></li>
                <li><a href="library.html">Library</a></li>
                <li><a href="wishlist.html">Wishlist</a></li>
                <li><a href="publisher.html">Publisher</a></li>
                <li><a href="refunds.html">Refunds</a></li>
                <li><a href="profile.html" class="active">Profile</a></li>
                <li><a href="cart.html">Cart</a></li>
            </ul>
            <div class="user-section" id="user-section">
            </div>
        </nav>
    </header>

    <div class="container">
        <div class="profile-header">
            <div class="profile-avatar">
                <span id="avatarInitial" class="avatar-initial">U</span>
            </div>
            <div class="profile-info">
                <h1 id="profileUsername">Loading...</h1>
                <div class="profile-stats">
                    <div class="stat">
                        <span class="stat-value" id="gamesOwned">0</span>
                        <span class="stat-label">Games Owned</span>
                    </div>
                    <div class="stat">
                        <span class="stat-value" id="familySize">0</span>
                        <span class="stat-label">Family Members</span>
                    </div>
                </div>
            </div>
        </div>

        <div class="profile-content">
            <section class="profile-section">
                <h2 class="section-title">Family Members</h2>
                <div id="familyList" class="friends-grid">
                    <p class="family-empty">Not in a family yet</p>
                </div>
                <div class="family-actions" id="familyActions">
                    <button class="btn" id="createFamilyBtn">Create Family</button>
                    <div id="addFamilySection" style="display:none;">
                        <div style="display: flex; gap: 10px; margin-top: 15px;">
                            <input type="text" id="usernameToAdd" placeholder="Username to add" style="flex: 1;">
                            <button class="btn" id="addToFamilyBtn">Add User</button>
                        </div>
                        <button class="btn btn-danger" id="leaveFamilyBtn" style="margin-top: 10px;">Leave Family</button>
                    </div>
                </div>
            </section>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
